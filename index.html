<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in GoodNotes</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         padding: 24px; box-sizing: border-box; text-align: center;
         font-family: -apple-system, system-ui, sans-serif; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 20px; }
  a.button { display: inline-block; padding: 14px 28px; border-radius: 12px;
             background: #2a78d6; color: #fff; font-size: 18px; text-decoration: none; }
  p { color: GrayText; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening…</h1>
  <a class="button" id="open" href="#">Open in GoodNotes</a>
  <p id="note">If nothing happens, tap the button.</p>
</main>
<script>
  // A link like  .../?name=Hui%202021  runs the Apple Shortcut called "Hui 2021",
  // which opens that notebook in GoodNotes. Google Sheets only allows web links,
  // so this page passes the request on to the Shortcuts app.
  (function () {
    const shortcutName = new URLSearchParams(window.location.search).get("name");
    const button = document.getElementById("open");
    if (shortcutName) {
      const target = "shortcuts://run-shortcut?name=" + encodeURIComponent(shortcutName);
      document.getElementById("title").textContent = shortcutName;
      button.href = target;
      window.location.href = target;
    } else {
      document.getElementById("title").textContent = "No paper named in this link";
      button.style.display = "none";
      document.getElementById("note").textContent = "Links should end in ?name=Paper%20name";
    }
  })();
</script>
</body>
</html>
